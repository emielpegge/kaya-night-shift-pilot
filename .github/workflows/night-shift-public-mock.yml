name: Public Night Shift MOCK pilot

on:
  workflow_dispatch:
    inputs:
      approved_task:
        description: Fixed pre-approved synthetic task identifier
        required: true
        default: synthetic-documentation-check-v1
        type: choice
        options:
          - synthetic-documentation-check-v1

# Default and every job remain read-only. This workflow cannot create branches,
# commits, pull requests, releases, deployments, schedules, or external calls.
permissions:
  contents: read

concurrency:
  group: public-night-shift-mock-pilot
  cancel-in-progress: false

jobs:
  controller-prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.11'
      - name: Verify fixed task and prepare handoff
        run: python -m night_shift_pilot.controller prepare --output "$RUNNER_TEMP/night-shift"
        env:
          APPROVED_TASK: ${{ inputs.approved_task }}
          NIGHT_SHIFT_STOP: ${{ vars.NIGHT_SHIFT_STOP }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-night-shift-controller-report
          path: ${{ runner.temp }}/night-shift
          if-no-files-found: error
          retention-days: 7

  mock-worker:
    needs: controller-prepare
    if: needs.controller-prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-night-shift-controller-report
          path: ${{ runner.temp }}/night-shift
      - name: Execute deterministic MOCK worker
        run: python -m night_shift_pilot.worker --prepared "$RUNNER_TEMP/night-shift/prepared.json" --output "$RUNNER_TEMP/night-shift"
        env:
          NIGHT_SHIFT_STOP: ${{ vars.NIGHT_SHIFT_STOP }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-night-shift-worker-report
          path: ${{ runner.temp }}/night-shift/result.json
          if-no-files-found: error
          retention-days: 7

  controller-finalize:
    needs: [controller-prepare, mock-worker]
    if: always() && needs.mock-worker.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-night-shift-controller-report
          path: ${{ runner.temp }}/controller
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-night-shift-worker-report
          path: ${{ runner.temp }}/worker
      - name: Verify handoff and generate final report
        run: >-
          python -m night_shift_pilot.controller finalize
          --prepared "$RUNNER_TEMP/controller/prepared.json"
          --result "$RUNNER_TEMP/worker/result.json"
          --output "$RUNNER_TEMP/night-shift"
        env:
          NIGHT_SHIFT_STOP: ${{ vars.NIGHT_SHIFT_STOP }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-night-shift-final-report
          path: ${{ runner.temp }}/night-shift/report.json
          if-no-files-found: error
          retention-days: 7
